basics:
  name: Marcos Rosse
  label: Site Reliability Engineer
  email: interviews@mrosse.com
  url: https://marcosrosse.github.io/
  summary: >-
    Site Reliability Engineer in Lisbon with six years in DevOps and SRE and six before that as a
    Linux sysadmin. I run Kubernetes platforms on AWS for large video streaming services. Before
    that I built CI/CD and moved banks and telecom operators onto OpenShift. Most of my work is
    infrastructure as code, observability, and making releases and traffic peaks routine.
  location:
    city: Lisbon
    countryCode: PT
    region: Lisbon
  profiles:
    - network: LinkedIn
      username: marcosrosse
      url: https://www.linkedin.com/in/marcosrosse/
    - network: GitHub
      username: marcosrosse
      url: https://github.com/marcosrosse

work:
  - name: Sky
    position: Site Reliability Engineer
    location: Lisbon, Portugal
    startDate: "2023-10"
    summary: Reliability and platform work for Sky UK's video streaming services.
    highlights:
      - Prepare and scale Kubernetes (Amazon EKS) environments for high-traffic live sports events.
      - Build and maintain CI/CD pipelines for services running on EKS.
      - Manage CDN traffic routing and delivery configuration for global audiences.
      - Run the metrics stack and build dashboards and alerts wired into incident response; part of the on-call rotation.
      - Provision AWS infrastructure as code, and scale environments down during low-traffic periods to cut cost.
      - Remediate vulnerabilities across Linux hosts and internal code.

  - name: Velv
    position: DevOps Engineer
    location: Lisbon, Portugal
    startDate: "2022-08"
    endDate: "2023-10"
    summary: Consultancy for telecom operators.
    highlights:
      - Led the migration of monolithic applications from legacy infrastructure to OpenShift for a telecom operator in the Middle East.
      - Helped design its disaster recovery environment.
      - Unblocked a stalled Kubernetes upgrade for a European telecom operator.

  - name: Avanade
    position: DevOps Engineer
    location: São Paulo, Brazil
    startDate: "2021-03"
    endDate: "2022-08"
    summary: Consultancy for a Swiss private bank.
    highlights:
      - Moved the bank's workloads from Azure to an on-premises OpenShift platform.
      - Standardised CI/CD for more than 50 microservices.
      - Built environments as code with Terraform, Helm and Kustomize, and ran the platform's secrets, messaging and data services.
      - Mentored development teams on DevOps practices; promoted for the results.

  - name: NTT DATA (Everis)
    position: DevOps Engineer
    location: São Paulo, Brazil
    startDate: "2019-08"
    endDate: "2021-02"
    summary: Consultancy for one of Brazil's largest banks.
    highlights:
      - Automated developer onboarding, from repositories and pipelines to dashboards, monitoring and infrastructure.
      - Built CI/CD pipelines for digital banking services.
      - Provisioned and maintained API gateways.
      - Automated OpenStack provisioning with Terraform for an internal platform as a service.

  - name: Brazilian Air Force (São Paulo Support Group)
    position: IT Analyst and Systems Administrator
    location: São Paulo, Brazil
    startDate: "2013-08"
    endDate: "2019-07"
    summary: Enlisted IT role during military service.
    highlights:
      - Ran Linux servers on XenServer and managed more than 100 Ubuntu desktops with Ansible.
      - Set up central logging and monitoring for the unit's network.
      - Ran the firewall, web proxy, backups and directory services (LDAP and Samba).

