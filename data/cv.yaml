basics:
  name: Marcos Rosse
  label: Site Reliability and Platform Engineer
  email: interviews@mrosse.com
  url: https://marcosrosse.github.io/
  summary: >-
    Site Reliability Engineer in Lisbon with six years in DevOps and SRE and six before that as a
    Linux sysadmin. At Sky I keep streaming applications reliable for services across Europe and
    the US, including Peacock, SkyShowtime and NOW TV. Before that I built CI/CD and moved banks
    and telecom operators onto OpenShift. My focus is platform engineering: infrastructure as code,
    CI/CD, observability and edge delivery, and making releases and traffic peaks routine.
  location:
