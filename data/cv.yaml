work:
  - name: Sky
    position: Site Reliability Engineer
    location: Lisbon, Portugal
    startDate: "2023-10"
    summary: >-
      Comcast NBCUniversal's Global Streaming Technology group, behind Sky UK, Sky Deutschland,
      Sky Italia, Peacock (US), SkyShowtime and NOW TV. My team sits in the middle: we run on the
      shared EKS clusters and Akamai CDN owned by other platform teams, and the application teams
      we support run on what we provide.
    highlights:
      - When the EKS platform team planned a load balancer change, checked our older Akamai properties and found more than 30 that predated the current setup and did not send SNI to the origin, which would have broken those services once the change went live; fixed all of them before the rollout.
      - Wrote a Python Prometheus exporter for GitHub service health (Git operations, Actions, pull requests, issues), with dashboards and alerts, after GitHub outages kept disrupting the team's work.
      - "Automated credentials for new RDS and DocumentDB instances: admin and user passwords are generated and stored in HashiCorp Vault, and Terragrunt reads them at creation time, so nobody handles a secret by hand."
      - Support the applications through releases, incidents and live sports peaks such as NFL games, and share the on-call rotation.
      - Own their observability and alerting with Prometheus, Thanos, Grafana and Alertmanager, including SLOs, certificate expiry checks, and alert routing to Slack and incident tooling.
      - "Manage the Akamai configuration they use: delivery properties, Global Traffic Management (GTM), Cloudlets, WAF security policies and TLS certificates."
      - Deploy and run the AWS resources they need as code with Terraform and Terragrunt, maintain the GitHub Actions and Jenkins pipelines onto the shared EKS clusters, scale non-production down outside traffic windows to cut cost, and patch vulnerabilities on hosts and in code.

  - name: Velv
    position: DevOps Engineer
    location: Lisbon, Portugal
    startDate: "2022-08"
    endDate: "2023-10"
    summary: Consultancy for telecom operators.
    highlights:
      - Led the migration of monolithic applications from legacy infrastructure to OpenShift for a telecom operator in the Middle East.
      - Helped design its disaster recovery environment.
      - Unblocked a stalled Kubernetes upgrade for a European telecom operator.

  - name: Avanade
    position: DevOps Engineer
    location: São Paulo, Brazil
    startDate: "2021-03"
    endDate: "2022-08"
    summary: Consultancy for a Swiss private bank.
    highlights:
      - Moved the bank's workloads from Azure to an on-premises OpenShift platform.
      - Standardised CI/CD for more than 50 microservices.
      - Built environments as code with Terraform, Helm and Kustomize, and ran the platform's secrets, messaging and data services.
      - Mentored development teams on DevOps practices; promoted for the results.

  - name: NTT DATA (Everis)
    position: DevOps Engineer
    location: São Paulo, Brazil
    startDate: "2019-08"
    endDate: "2021-02"
    summary: Consultancy for one of Brazil's largest banks.
    highlights:
      - Automated developer onboarding, from repositories and pipelines to dashboards, monitoring and infrastructure.
      - Built CI/CD pipelines for digital banking services.
      - Provisioned and maintained API gateways.
      - Automated OpenStack provisioning with Terraform for an internal platform as a service.

  - name: Brazilian Air Force (São Paulo Support Group)
    position: IT Analyst and Systems Administrator
    location: São Paulo, Brazil
    startDate: "2013-08"
    endDate: "2019-07"
    summary: Enlisted IT role during military service.
    highlights:
      - Ran Linux servers on XenServer and managed more than 100 Ubuntu desktops with Ansible.
      - Set up central logging and monitoring for the unit's network.
      - Ran the firewall, web proxy, backups and directory services (LDAP and Samba).

