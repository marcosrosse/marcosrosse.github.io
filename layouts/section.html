{{ define "main" }}
<section class="wrap page-head">
  <h1>{{ .Title }}</h1>
  {{ .Content }}
</section>
<section class="wrap">
  {{ with .Pages }}
    <ul class="post-list">
      {{ range . }}{{ partial "post-item.html" . }}{{ end }}
    </ul>
  {{ else }}
    <p class="empty">No posts yet.</p>
  {{ end }}
</section>
{{ end }}
